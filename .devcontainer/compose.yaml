name: omed-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/omed:cached
      - go-mod-cache:/home/vscode/go/pkg
      - cargo-registry:/home/vscode/.cargo/registry
      - bun-cache:/home/vscode/.bun/install/cache
    environment:
      TZ: Asia/Makassar
      # --- auth (apps/auth) ---
      AUTH_URL: http://localhost:9001
      AUTH_TRUSTED_ORIGINS: http://localhost:3001 http://localhost:9002 http://localhost:9003
      AUTH_SECRET: dev-only-secret-change-me-please-32chars
      AUTH_DB_DRIVER: node
      AUTH_DB_URL: postgres://omed:omed@db:5432/omed
      AUTH_JWKS_URL: http://localhost:9001/jwks

      # --- finance (apps/finance) ---
      FIN_DB_URL: postgres://omed:omed@db:5432/omed
      FIN_PORT: "9002"

      # --- blog (apps/blog) ---
      BLOG_DATABASE_URL: postgres://omed:omed@db:5432/omed

      # -- dashboard (apps/dash) ---
      VITE_AUTH_URL: http://localhost:9001
      VITE_PUBLIC_URL: http://localhost:3001
    #depends_on:
    #  db:
    #    condition: service_healthy

volumes:
  pgdata:
  go-mod-cache:
  cargo-registry:
  bun-cache:
