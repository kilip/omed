services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      # Mount the parent dir so the repo folder name does not matter (Codespaces)
      - ..:/workspaces:cached
      - bash-history:/commandhistory
    environment:
      AUTH_DB_URL: postgres://omed:omed@postgres:5432/omed
      # Dev-only default. Override with a Codespaces secret or a local env var.
      AUTH_SECRET: 6171ce314c622f9a4cdb542c810d40b91edde2f659bcd5224c6aeee7d7ea4925
      AUTH_TRUSTED_ORIGINS: "http://localhost:3001 http://localhost:8002"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      # wrangler dev (apps/auth) uses this when the Hyperdrive binding is named HYPERDRIVE
      WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://omed:omed@postgres:5432/omed?options=-c%20search_path%3Dauth
      KAFKA_BROKERS: kafka:9092

      # finance env config
      FIN_DB_URL: postgres://omed:omed@postgres:5432/omed?sslmode=disable

      # blog env config
      BLOG_DB_URL: postgres://omed:omed@postgres:5432/omed?sslmode=disable

      VITE_AUTH_URL: "http://localhost:8001"
      VITE_PUBLIC_URL: "http://localhost:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_started }
      kafka: { condition: service_healthy }

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omed
      POSTGRES_PASSWORD: omed
      POSTGRES_DB: omed
    volumes:
      # PG 18+: mount at /var/lib/postgresql, not /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql
      # initdb scripts only run when the volume is first created
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omed -d omed"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfsdata:/data
    command: /data

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    # No host port publish: the workspace reaches Kafka over the compose network.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    # Start on demand: docker compose --profile tools up -d kafka-ui
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  kafka-data:
  bash-history:
