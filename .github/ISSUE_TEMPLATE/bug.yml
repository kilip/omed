name: Bug report
description: Report something that is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [core, fin, cms, agent, cross-cutting, unknown]
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Affected scope
      options:
        - label: api (Go)
        - label: web (React Router)
        - label: e2e
        - label: deploy (Helm)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual behavior, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit SHA"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Redact secrets, tokens, and personal data before pasting.
      render: shell
