name: Documentation
description: Fix, add, or improve documentation.
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: "README.md, docs/architecture.md, helm/README.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
