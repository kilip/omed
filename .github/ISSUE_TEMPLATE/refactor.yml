name: Refactor or chore
description: Internal change with no intended behavior change.
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [core, fin, cms, agent, cross-cutting]
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What changes, and why is it worth doing?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Target structure, placement, and any deviation from AGENTS.md.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include "behavior unchanged" checks where relevant.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
