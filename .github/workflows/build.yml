name: Build

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
          - app: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name != 'release' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file && matrix.file || format('apps/{0}/Dockerfile', matrix.app) }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  chart:
    name: Package and push Helm chart
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package helm -d .cr-release-packages

      - name: Push Helm chart to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push .cr-release-packages/omed-*.tgz "oci://ghcr.io/${OWNER}/charts"

  deploy-nightly:
    name: Update homelab omed-nightly
    needs: build
    if: github.event_name != 'release' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ASPRI_CLIENT_ID }}
          private-key: ${{ secrets.ASPRI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homelab

      - name: Checkout homelab repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homelab
          token: ${{ steps.app-token.outputs.token }}
          path: homelab

      - name: Update omed-nightly image tag
        env:
          SIGNING_KEY: ${{ secrets.ASPRI_SIGN_KEY }}
          SIGN_NAME: ${{ vars.SIGN_NAME }}
          SIGN_EMAIL: ${{ vars.SIGN_EMAIL }}
        run: |
          cd homelab
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_TAG="sha-${SHORT_SHA}"

          echo "Updating omed-nightly image tag to ${NEW_TAG}..."
          yq -i ".spec.values.api.image.tag = \"${NEW_TAG}\"" k8s/apps/omed-nightly/app/helmrelease.yaml
          yq -i ".spec.values.web.image.tag = \"${NEW_TAG}\"" k8s/apps/omed-nightly/app/helmrelease.yaml

          if git diff --quiet k8s/apps/omed-nightly/app/helmrelease.yaml; then
            echo "No changes in image tag."
            exit 0
          fi

          if [[ -n "${SIGNING_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SIGNING_KEY" > ~/.ssh/signing_key
            chmod 600 ~/.ssh/signing_key
            git config --global gpg.format ssh
            git config --global user.signingkey ~/.ssh/signing_key
            git config --global commit.gpgsign true
          fi

          AUTHOR_NAME="${SIGN_NAME:-github-actions[bot]}"
          AUTHOR_EMAIL="${SIGN_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git add k8s/apps/omed-nightly/app/helmrelease.yaml
          git commit -m "chore: 🔧 update omed-nightly image tag to ${NEW_TAG}"
          git push origin main

