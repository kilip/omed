name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  finance:
    name: Finance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/finance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/finance/go.sum

      - name: Run Unit Tests (-race)
        run: go test ./internal/... -race

      - name: Run Integration Tests (-p 1)
        run: go test ./tests/... -p 1

  better-auth:
    name: Better Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest Suite
        working-directory: packages/better-auth
        run: bun run test --run

      - name: Build Package
        working-directory: packages/better-auth
        run: bun run build

  dash:
    name: Dash Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Dash
        working-directory: apps/dash
        run: bun run typecheck

      - name: Build Dash
        working-directory: apps/dash
        run: bun run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium & System Dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: apps/dash
        run: bun run test:e2e

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-e2e-report
          path: apps/dash/test-reports/
          retention-days: 7

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Types
        run: bun run check-types
