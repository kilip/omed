name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commits
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose


  finance:
    name: Finance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/finance?sslmode=disable
    defaults:
      run:
        working-directory: apps/finance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/finance/go.sum

      - name: Run Unit Tests (-race)
        run: go test ./internal/... -race

      - name: Run Integration Tests (-p 1)
        run: go test ./tests/... -p 1

  better-auth:
    name: Better Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_DB_URL: postgresql://postgres:password@localhost:5432/auth?sslmode=disable
      AUTH_SECRET: dev-secret-key-12345678901234567890
      AUTH_BASE_PATH: ""
      AUTH_DB_DRIVER: node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest Suite
        working-directory: packages/better-auth
        run: bun run test --run

      - name: Build Package
        working-directory: packages/better-auth
        run: bun run build

  dash:
    name: Dash Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Dash
        working-directory: apps/dash
        run: bun run typecheck

      - name: Build Dash
        working-directory: apps/dash
        run: bun run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_DB_URL: postgresql://postgres:password@localhost:5432/auth?sslmode=disable
      AUTH_SECRET: dev-secret-key-12345678901234567890
      AUTH_BASE_PATH: ""
      AUTH_DB_DRIVER: node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Install Playwright Chromium & System Dependencies
        run: bunx playwright install --with-deps chromium

      - name: Build Packages
        run: bun run build

      - name: Push Auth DB Schema
        run: bun run db:push

      - name: Start Dev Servers
        run: |
          bun run --cwd apps/auth dev &
          bun run --cwd apps/dash dev &
          for i in {1..30}; do
            if curl -s -f http://localhost:9001/hello > /dev/null && curl -s -f http://localhost:3001 > /dev/null; then
              echo "Dev servers are ready!"
              exit 0
            fi
            echo "Waiting for servers to start ($i/30)..."
            sleep 1
          done
          echo "Dev servers failed to start in time!"
          exit 1

      - name: Run E2E Tests
        working-directory: apps/dash
        run: bun run test:e2e

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-e2e-report
          path: apps/dash/test-reports/
          retention-days: 7

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Types
        run: bun run check-types
