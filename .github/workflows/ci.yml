name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        working-directory: apps/api
        run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage.txt

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The e2e runner starts auth, api and web itself. Values mirror
      # `.env.example` and `.devcontainer/compose.yaml`; the secret is a
      # throwaway one for CI only.
      HUSKY: "0"
      OMED_DB_URL: postgres://omed:omed@localhost:5432/omed?sslmode=disable
      OMED_AUTH_URL: http://localhost:8001
      OMED_API_URL: http://localhost:8002
      OMED_WEB_URL: http://localhost:3001
      OMED_TRUSTED_ORIGINS: http://localhost:3001,http://localhost:8002,http://localhost:8001
      OMED_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      OMED_REDIS_URL: redis://localhost:6379
      OMED_KAFKA_BROKERS: localhost:9092
      OMED_S3_ENDPOINT: http://localhost:9000
      OMED_S3_ACCESS_KEY: rustfsadmin
      OMED_S3_SECRET_KEY: rustfsadmin
      OMED_S3_REGION: us-east-1
      OMED_S3_FORCE_PATH_STYLE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same Postgres, Redis, RustFS and Kafka as the devcontainer, so CI and
      # local dev cannot drift. `.github/compose.e2e.yaml` publishes the ports.
      - name: Start services
        run: >-
          docker compose
          -f .devcontainer/compose.yaml
          -f .github/compose.e2e.yaml
          up -d --wait postgres redis rustfs kafka

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      # Creates the `auth` schema. The API creates its own tables on boot.
      - name: Push auth database schema
        working-directory: packages/better-auth
        run: bun run db:push

      - name: Run E2E tests
        run: bun run e2e

      - name: Dump service logs
        if: failure()
        run: >-
          docker compose
          -f .devcontainer/compose.yaml
          -f .github/compose.e2e.yaml
          logs --no-color --tail 200 postgres redis rustfs kafka

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/reports
          if-no-files-found: ignore
          retention-days: 7
