name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome check
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    env:
      CHART_DIR: helm
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Lint chart
        run: |
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            helm lint "$CHART_DIR" --strict -f "$values"
          done

      - name: Validate rendered manifests
        run: |
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            helm template omed "$CHART_DIR" -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.30.0
          done

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    env:
      OMED_DB_URL: postgres://omed:omed@localhost:5432/omed?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: omed
          POSTGRES_PASSWORD: omed
          POSTGRES_DB: omed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omed -d omed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install swag and atlas
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@latest
          curl -sSf https://atlasgo.sh | sh -s -- --yes

      - name: Regenerate Ent
        working-directory: apps/api
        run: go generate ./ent

      - name: Check database migrations and schema drift
        working-directory: apps/api
        run: |
          go run ./cmd/migrate --check
          atlas migrate validate --env local

      - name: Regenerate Swagger
        working-directory: apps/api
        run: swag init --parseInternal --v3.1

      - name: Regenerate OpenAPI TypeScript types
        run: bunx openapi-typescript apps/api/docs/swagger.json -o packages/openapi/src/api.ts

      - name: Format generated code
        run: bun run format

      - name: Fail on git diff
        run: git diff --exit-code

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run go vet
        working-directory: apps/api
        run: go vet ./...

  golangci-lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: apps/api

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
          work-dir: apps/api
          go-package: ./...

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        working-directory: apps/api
        run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage.txt
          flags: api

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Web tests
        working-directory: apps/web
        run: bun run test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The e2e runner starts auth, api and web itself. Values mirror
      # `.env.example`; the secret is a throwaway one for CI only.
      HUSKY: "0"
      OMED_DB_URL: postgres://omed:omed@localhost:5432/omed?sslmode=disable
      OMED_S3_DRIVER: s3
      OMED_S3_ENDPOINT: http://localhost:9000
      OMED_S3_REGION: us-east-1
      OMED_S3_ACCESS_KEY: rustfsadmin
      OMED_S3_SECRET_KEY: rustfsadmin
      OMED_S3_FORCE_PATH_STYLE: "true"
      OMED_ATTACHMENT_MAX_SIZE_MB: "10"
      OMED_ATTACHMENT_ALLOWED_TYPES: ".pdf,.png,.jpg,.jpeg,.webp,.csv,.xls,.xlsx"
      VITE_ATTACHMENT_MAX_SIZE_MB: "10"
      VITE_ATTACHMENT_ALLOWED_TYPES: ".pdf,.png,.jpg,.jpeg,.webp,.csv,.xls,.xlsx"
      OMED_API_URL: http://localhost:8001
      OMED_WEB_URL: http://localhost:3000
      OMED_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:8001
      OMED_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: omed
          POSTGRES_PASSWORD: omed
          POSTGRES_DB: omed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omed -d omed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_ADDRESS: ":9000"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health >/dev/null"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Atlas and apply database migrations
        working-directory: apps/api
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --yes
          atlas migrate apply --env local

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            coverage/lcov.info
            coverage/api-e2e.txt
          flags: e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/reports
          if-no-files-found: ignore
          retention-days: 7
