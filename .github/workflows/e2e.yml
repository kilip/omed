name: e2e

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: omed
          POSTGRES_PASSWORD: omed
          POSTGRES_DB: omed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omed -d omed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/finance/go.mod
          cache-dependency-path: apps/finance/go.sum

      - name: Build Finance API
        working-directory: apps/finance
        run: go build -o bin/api ./cmd/api

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: bunx playwright install chromium

      - name: Run E2E tests
        run: bun run e2e
        env:
          AUTH_DB_URL: postgresql://omed:omed@localhost:5432/omed
          AUTH_SECRET: e2e-ci-dummy-secret-not-for-production-1234567890
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

