name: merge-pr
on:
  issue_comment:
    types: [created]

concurrency:
  group: rebase-merge-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.verify.outputs.allowed }}
      sha: ${{ steps.verify.outputs.sha }}
      head_ref: ${{ steps.verify.outputs.head_ref }}
    steps:
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          allowed=false

          perm=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" --jq '.permission')
          echo "Commenter $COMMENTER permission: $perm"

          if [[ "$perm" != "admin" && "$perm" != "write" ]]; then
            echo "Skip: commenter bukan maintainer."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "head_ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          pr_state=$(echo "$pr_json" | jq -r '.state')
          base_ref=$(echo "$pr_json" | jq -r '.base.ref')
          is_draft=$(echo "$pr_json" | jq -r '.draft')
          head_repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')
          head_sha=$(echo "$pr_json" | jq -r '.head.sha')
          head_ref=$(echo "$pr_json" | jq -r '.head.ref')

          echo "PR #$PR_NUMBER state: $pr_state | base: $base_ref | draft: $is_draft | repo: $head_repo | head: $head_sha | branch: $head_ref"

          if [[ "$pr_state" != "open" ]]; then
            echo "Skip: PR tidak dalam status open."
          elif [[ "$base_ref" != "main" ]]; then
            echo "Skip: base branch bukan main ($base_ref)."
          elif [[ "$is_draft" == "true" ]]; then
            echo "Skip: PR masih draft."
          elif [[ "$head_repo" != "${{ github.repository }}" ]]; then
            echo "Skip: PR dari fork ($head_repo)."
          else
            allowed=true
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

  rebase:
    needs: check
    if: needs.check.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.ASPRI_CLIENT_ID }}
          private-key: ${{ secrets.ASPRI_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Setup SSH commit signing
        env:
          SIGNING_KEY: ${{ secrets.ASPRI_SIGN_KEY }}
          SIGN_NAME: ${{ vars.SIGN_NAME }}
          SIGN_EMAIL: ${{ vars.SIGN_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true
          git config --global user.name "$SIGN_NAME"
          git config --global user.email "$SIGN_EMAIL"

      - name: Rebase and ff-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          TARGET_SHA: ${{ needs.check.outputs.sha }}
          HEAD_REF: ${{ needs.check.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR_NUMBER"

          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "HEAD PR berubah setelah trigger, batal."
            exit 1
          fi

          git rebase origin/main
          git push --force-with-lease
          git checkout main
          git merge --ff-only -
          git push origin main

          if [[ -n "$HEAD_REF" && "$HEAD_REF" != "main" ]]; then
            git push origin --delete "$HEAD_REF"
          fi

      - name: Cleanup signing key
        if: always()
        run: rm -f ~/.ssh/signing_key
