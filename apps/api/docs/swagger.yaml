components:
  schemas:
    httpx.ErrorBody:
      properties:
        code:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/httpx.FieldError'
          type: array
          uniqueItems: false
        message:
          type: string
      type: object
    httpx.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/httpx.ErrorBody'
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.FieldError:
      properties:
        field:
          type: string
        rule:
          type: string
      type: object
    httpx.Meta:
      properties:
        cursor:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
      type: object
    httpx.WebResponse-array_model_UserResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.UserResponse'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    httpx.WebResponse-model_UserResponse:
      properties:
        data:
          $ref: '#/components/schemas/model.UserResponse'
        meta:
          $ref: '#/components/schemas/httpx.Meta'
      type: object
    model.CreateUserRequest:
      properties:
        avatar:
          type: string
        email:
          type: string
        name:
          type: string
      required:
      - email
      - name
      type: object
    model.SearchRequest:
      properties:
        cursor:
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
        name:
          type: string
      type: object
    model.UpdateUserRequest:
      properties:
        avatar:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    model.UserResponse:
      properties:
        avatar:
          type: string
        createdAt:
          type: string
        id:
          type: integer
        name:
          type: string
        updatedAt:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and JWT token.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    name: API Support
    url: https://github.com/kilip/omed
  description: REST backend for Omed.
  license:
    name: MIT
    url: https://github.com/kilip/omed/blob/main/LICENSE
  title: Omed API
  version: "1.0"
openapi: 3.1.0
paths:
  /users:
    post:
      description: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.CreateUserRequest'
              description: User creation payload
              summary: request
        description: User creation payload
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_UserResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Users
  /users/{id}:
    delete:
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
    get:
      description: Retrieve user detail by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_UserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      description: Update an existing user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.UpdateUserRequest'
              description: User update payload
              summary: request
        description: User update payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_UserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
  /users/search:
    post:
      description: Search users matching filter criteria with pagination cursor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.SearchRequest'
              description: Search filter criteria
              summary: request
        description: Search filter criteria
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-array_model_UserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Search users
      tags:
      - Users
servers:
- description: Local Development Server
  url: http://localhost:8002
