          type: string
        id:
          description: |-
            ID is the stable identifier in the form "<module>:<role>"; this is what member and
            invitation requests carry in their roles.
          type: string
        module:
          description: Module is the module that declared the role, e.g. "fin".
          type: string
        name:
          description: Name is the human readable display name, e.g. "Accountant".
          type: string
      type: object
    model.SearchAccountRequest:
      type: object
    model.SearchEntryRequest:
      properties:
        accountId:
          type: integer
        cursor:
          type: string
        dateFrom:
          example: "2026-01-01"
          type: string
        dateTo:
          example: "2026-01-31"
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
        periodId:
          type: integer
        status:
          enum:
          - DRAFT
          - POSTED
          - VOID
          type: string
        transactionId:
          type: integer
      type: object
    model.SearchExchangeRateRequest:
      properties:
        cursor:
          type: string
        endDate:
          example: "2026-12-31"
          type: string
        fromCurrency:
          example: USD
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
        startDate:
          example: "2026-01-01"
          type: string
        toCurrency:
          example: IDR
          type: string
      type: object
    model.SearchFileRequest:
      properties:
        cursor:
          type: string
        entityId:
          type: integer
        entityType:
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
        mimeType:
          type: string
        name:
          type: string
      type: object
    model.SearchInvitationRequest:
      properties:
        cursor:
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    model.SearchMemberRequest:
      properties:
        cursor:
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    model.SearchPeriodRequest:
      properties:
        fiscalYear:
          type: integer
        status:
          type: string
      type: object
    model.SearchTransactionRequest:
      properties:
        cursor:
          type: string
        dateFrom:
          example: "2026-01-01"
          type: string
        dateTo:
          example: "2026-01-31"
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
        query:
          type: string
        reference:
          type: string
        source:
          enum:
          - MANUAL
          - IMPORT
          - SYSTEM
          type: string
      type: object
    model.SearchWorkspaceRequest:
      properties:
        cursor:
          type: string
        limit:
          maximum: 100
          minimum: 1
          type: integer
        name:
          type: string
        ownerId:
          type: integer
      type: object
    model.SeedAccountsRequest:
      properties:
        lang:
          type: string
        template:
          type: string
      required:
      - lang
      - template
      type: object
    model.SeedAccountsResponse:
      properties:
        count:
          type: integer
      type: object
    model.SendInvitationRequest:
      properties:
        email:
          type: string
      required:
      - email
      type: object
    model.SendInvitationResponse:
      properties:
        sent:
          type: boolean
      type: object
    model.SessionData:
      properties:
        createdAt:
          type: string
        expiresAt:
          type: string
        id:
          type: integer
        ipAddress:
          type: string
        token:
          type: string
        updatedAt:
          type: string
        userAgent:
          type: string
        userId:
          type: integer
      type: object
    model.SessionResponse:
      properties:
        session:
          $ref: '#/components/schemas/model.SessionData'
        user:
          $ref: '#/components/schemas/model.UserData'
      type: object
    model.SignInSocialRequest:
      properties:
        callbackURL:
          type: string
        errorCallbackURL:
          type: string
        locale:
          type: string
        newUserCallbackURL:
          type: string
        provider:
          type: string
      required:
      - provider
      type: object
    model.SignInSocialResponse:
      properties:
        redirect:
          type: boolean
        url:
          type: string
      type: object
    model.TransactionResponse:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/model.FileResponse'
          type: array
          uniqueItems: false
        auditMeta:
          $ref: '#/components/schemas/base.AuditMeta'
        currency:
          example: IDR
          type: string
        description:
          type: string
        entries:
          items:
            $ref: '#/components/schemas/model.EntryResponse'
          type: array
          uniqueItems: false
        exchangeRate:
          example: 1
          type: number
        id:
          type: integer
        number:
          type: string
        reference:
          type: string
        source:
          example: MANUAL
          type: string
        transactionDate:
          example: "2026-01-01"
          type: string
        workspaceId:
          type: integer
      type: object
    model.TrialBalanceAccountItem:
      properties:
        accountCode:
          example: "1110"
          type: string
        accountId:
          type: integer
        accountName:
          example: Bank BCA IDR
          type: string
        credit:
          example: 0
          type: number
        currencies:
          items:
            $ref: '#/components/schemas/model.CurrencyBreakdownItem'
          type: array
          uniqueItems: false
        debit:
          example: 1000000
          type: number
        netBalance:
          example: 1000000
          type: number
        type:
          example: ASSET
          type: string
      type: object
    model.TrialBalanceRequest:
      properties:
        asOfDate:
          example: "2026-01-31"
          type: string
        includePerCurrencyBreakdown:
          example: false
          type: boolean
      required:
      - asOfDate
      type: object
    model.TrialBalanceResponse:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/model.TrialBalanceAccountItem'
          type: array
          uniqueItems: false
        asOfDate:
          example: "2026-01-31"
          type: string
        baseCurrency:
          example: IDR
          type: string
        isBalanced:
          example: true
          type: boolean
        totalCredit:
          example: 5000000
          type: number
        totalDebit:
          example: 5000000
          type: number
      type: object
    model.UpdateAccountRequest:
      properties:
        code:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        isPostable:
          type: boolean
        name:
          type: string
        normalBalance:
          enum:
          - DEBIT
          - CREDIT
          type: string
        parentId:
          type: integer
      required:
      - name
      type: object
    model.UpdateBaseCurrencyRequest:
      properties:
        baseCurrency:
          type: string
      required:
      - baseCurrency
      type: object
    model.UpdateEntryRequest:
      properties:
        description:
          type: string
        postings:
          items:
            $ref: '#/components/schemas/model.CreatePostingRequest'
          minItems: 2
          type: array
          uniqueItems: false
      required:
      - postings
      type: object
    model.UpdateExchangeRateRequest:
      properties:
        effectiveDate:
          example: "2026-01-01"
          type: string
        rate:
          example: 16300
          type: number
        source:
          enum:
          - MANUAL
          - IMPORT
          example: MANUAL
          type: string
      required:
      - effectiveDate
      - rate
      type: object
    model.UpdateFileRequest:
      properties:
        entityId:
          type: integer
        entityType:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    model.UpdateMemberRequest:
      properties:
        roles:
          items:
            type: string
          minItems: 1
          type: array
          uniqueItems: false
      required:
      - roles
      type: object
    model.UpdatePeriodRequest:
      properties:
        description:
          type: string
        endDate:
          example: "2026-01-31"
          type: string
        fiscalYear:
          example: 2026
          type: integer
        name:
          type: string
        startDate:
          example: "2026-01-01"
          type: string
      required:
      - endDate
      - fiscalYear
      - name
      - startDate
      type: object
    model.UpdateTransactionRequest:
      properties:
        description:
          type: string
        reference:
          type: string
      type: object
    model.UpdateUserRequest:
      properties:
        avatar:
          type: string
        currency:
          type: string
        locale:
          enum:
          - en
          - id
          type: string
        name:
          type: string
      type: object
    model.UpdateWorkspaceRequest:
      properties:
        description:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    model.UserData:
      properties:
        currency:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        id:
          type: integer
        image:
          type: string
        locale:
          type: string
        name:
          type: string
      type: object
    model.UserResponse:
      properties:
        avatar:
          type: string
        createdAt:
          type: string
        currency:
          type: string
        email:
          type: string
        id:
          type: integer
        locale:
          type: string
        name:
          type: string
        updatedAt:
          type: string
      type: object
    model.WorkspaceBaseCurrencyResponse:
      properties:
        baseCurrency:
          type: string
        id:
          type: integer
        name:
          type: string
      type: object
    model.WorkspaceResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          $ref: '#/components/schemas/base.ByUser'
        description:
          type: string
        id:
          type: integer
        name:
          type: string
        owner:
          $ref: '#/components/schemas/model.UserResponse'
        personal:
          type: boolean
        updatedAt:
          type: string
        updatedBy:
          $ref: '#/components/schemas/base.ByUser'
      type: object
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and JWT token.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    name: API Support
    url: https://github.com/kilip/omed
  description: REST backend for Omed.
  license:
    name: MIT
    url: https://github.com/kilip/omed/blob/main/LICENSE
  title: Omed API
  version: "1.0"
openapi: 3.1.0
paths:
  /auth/callback/{id}:
    get:
      description: Handle authorization code callback from OAuth provider and establish
        session
      parameters:
      - description: OAuth Provider (e.g. google, github)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Authorization code
        in: query
        name: code
        schema:
          type: string
      - description: CSRF state token
        in: query
        name: state
        schema:
          type: string
      - description: Error reason from provider
        in: query
        name: error
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirects to frontend callback URL
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      summary: OAuth2 callback
      tags:
      - Authentication
  /auth/get-session:
    get:
      description: Retrieve authenticated session and user details
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.SessionResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unauthorized
      summary: Get current session
      tags:
      - Authentication
  /auth/sign-in/social:
    post:
      description: Initiate OAuth2 social login (Google, GitHub) and get authorization
        URL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.SignInSocialRequest'
              description: Sign-in payload
              summary: request
        description: Sign-in payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.SignInSocialResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      summary: Sign in with social provider
      tags:
      - Authentication
  /auth/sign-out:
    post:
      description: Revoke current session from database and clear session cookie
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
          description: OK
      summary: Sign out
      tags:
      - Authentication
  /invitations/{token}:
    get:
      description: Returns workspace details, inviter name, and token validity for
        previewing an invitation
      parameters:
      - description: Invitation Token
        in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_PublicInvitationResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      summary: Get public invitation preview
      tags:
      - Workspace Invitations
  /invitations/{token}/accept:
    post:
      description: Join a workspace using an active invitation token
      parameters:
      - description: Invitation Token
        in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_MemberResponse'
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Accept workspace invitation
      tags:
      - Workspace Invitations
  /users/me:
    get:
      description: Retrieve authenticated user's profile and preferences (locale,
        currency)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_UserResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    put:
      description: Update authenticated user's profile and preferences (locale, currency,
        name, avatar)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.UpdateUserRequest'
              description: Update user payload
              summary: request
        description: Update user payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_UserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /workspaces:
    post:
      description: Create a new workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.CreateWorkspaceRequest'
              description: Workspace creation payload
              summary: request
        description: Workspace creation payload
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_WorkspaceResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create workspace
      tags:
      - Workspaces
  /workspaces/{wid}:
    delete:
      description: Delete a workspace by ID
      parameters:
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete workspace
      tags:
      - Workspaces
    get:
      description: Retrieve workspace detail by ID
      parameters:
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_WorkspaceResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get workspace by ID
      tags:
      - Workspaces
    put:
      description: Update an existing workspace by ID
      parameters:
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.UpdateWorkspaceRequest'
              description: Workspace update payload
              summary: request
        description: Workspace update payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_WorkspaceResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update workspace
      tags:
      - Workspaces
  /workspaces/{wid}/files:
    post:
      description: Upload a file via multipart/form-data into the workspace's dedicated
        S3 bucket
      parameters:
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                entityId:
                  description: Optional associated entity ID
                  type: integer
                entityType:
                  description: Optional associated entity type (e.g. fin:transaction)
                  type: string
                file:
                  description: File to upload
                  format: binary
                  type: string
                name:
                  description: Custom display filename
                  type: string
              required:
              - file
              type: object
        description: File to upload
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.WebResponse-model_FileResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Upload workspace file
      tags:
      - Workspace Files
  /workspaces/{wid}/files/{id}:
    delete:
      description: Delete the file object from S3 and soft-delete its metadata record
        in the database
      parameters:
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: integer
      - description: File ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
