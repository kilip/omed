components:
  schemas:
    model.AccountResponse:
      properties:
        code:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        createdByName:
          type: string
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
        status:
          $ref: '#/components/schemas/model.AccountStatus'
        type:
          $ref: '#/components/schemas/model.AccountType'
        updatedAt:
          type: string
        updatedBy:
          type: string
        updatedByName:
          type: string
        workspaceId:
          type: string
      type: object
    model.AccountStatus:
      enum:
      - active
      - archived
      type: string
      x-enum-varnames:
      - AccountStatusActive
      - AccountStatusArchived
    model.AccountType:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      x-enum-varnames:
      - AccountTypeAsset
      - AccountTypeLiability
      - AccountTypeEquity
      - AccountTypeRevenue
      - AccountTypeExpense
    model.CreateAccountRequest:
      properties:
        code:
          maxLength: 32
          type: string
        currency:
          example: IDR
          type: string
        description:
          maxLength: 1000
          type: string
        name:
          maxLength: 255
          type: string
        parentId:
          type: string
        type:
          $ref: '#/components/schemas/model.AccountType'
      required:
      - code
      - currency
      - name
      - type
      type: object
    model.ErrorBody:
      properties:
        code:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/model.FieldError'
          type: array
          uniqueItems: false
        message:
          type: string
      type: object
    model.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/model.ErrorBody'
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.FieldError:
      properties:
        field:
          type: string
        rule:
          type: string
      type: object
    model.Meta:
      properties:
        cursor:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
      type: object
    model.SeedAccountRequest:
      properties:
        currency:
          example: IDR
          type: string
        force:
          type: boolean
        lang:
          type: string
        profile:
          type: string
      required:
      - lang
      - profile
      type: object
    model.SeedPreviewAccount:
      properties:
        code:
          type: string
        name:
          type: string
        parentCode:
          type: string
        type:
          enum:
          - asset
          - liability
          - equity
          - revenue
          - expense
          type: string
      type: object
    model.SeedPreviewResponse:
      properties:
        accountCount:
          type: integer
        accounts:
          items:
            $ref: '#/components/schemas/model.SeedPreviewAccount'
          type: array
          uniqueItems: false
        entryCount:
          type: integer
        lang:
          type: string
        profile:
          type: string
      type: object
    model.SeedTemplateResponse:
      properties:
        description:
          type: string
        id:
          type: string
        languages:
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
      type: object
    model.UpdateAccountRequest:
      properties:
        description:
          maxLength: 1000
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        parentId:
          type: string
        status:
          $ref: '#/components/schemas/model.AccountStatus'
      type: object
    model.WebResponse-array_model_AccountResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.AccountResponse'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.WebResponse-array_model_SeedTemplateResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.SeedTemplateResponse'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.WebResponse-model_AccountResponse:
      properties:
        data:
          $ref: '#/components/schemas/model.AccountResponse'
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.WebResponse-model_SeedPreviewResponse:
      properties:
        data:
          $ref: '#/components/schemas/model.SeedPreviewResponse'
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: API Server for Finance Service Application
  title: Finance Service API
  version: "1.0"
openapi: 3.1.0
paths:
  /accounts:
    get:
      description: Return all accounts in the active workspace (flat list, tree is
        built client-side).
      parameters:
      - description: Filter by account type
        in: query
        name: type
        schema:
          enum:
          - asset
          - liability
          - equity
          - revenue
          - expense
          type: string
      - description: Filter by status
        in: query
        name: status
        schema:
          enum:
          - active
          - archived
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-array_model_AccountResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      description: Create a new account in the active workspace.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.CreateAccountRequest'
              description: Account payload
              summary: request
        description: Account payload
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-model_AccountResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      description: Delete an account by ID.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - accounts
    get:
      description: Get a single account by ID.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-model_AccountResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get account
      tags:
      - accounts
    put:
      description: Update mutable fields of an account. Code, type and currency cannot
        be changed.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.UpdateAccountRequest'
              description: Account payload
              summary: request
        description: Account payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-model_AccountResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update account
      tags:
      - accounts
  /accounts/seed:
    post:
      description: Seed chart of accounts using preset profile and language.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.SeedAccountRequest'
              description: Seed request payload
              summary: request
        description: Seed request payload
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-array_model_AccountResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Seed accounts
      tags:
      - accounts
  /accounts/seed/preview:
    get:
      description: Preview chart of accounts for a template and language, including
        workspace counts.
      parameters:
      - description: Profile name
        in: query
        name: profile
        required: true
        schema:
          type: string
      - description: Language code
        in: query
        name: lang
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-model_SeedPreviewResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get seed preview
      tags:
      - accounts
  /accounts/seed/templates:
    get:
      description: Get list of available chart of accounts seed template profiles.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-array_model_SeedTemplateResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get seed templates
      tags:
      - accounts
