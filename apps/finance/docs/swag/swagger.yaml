paths:
  /accounts:
    get:
      description: Return all accounts in the active workspace (flat list, tree is
        built client-side).
      parameters:
      - description: Filter by account type
        in: query
        name: type
        schema:
          enum:
          - asset
          - liability
          - equity
          - revenue
          - expense
          type: string
      - description: Filter by status
        in: query
        name: status
        schema:
          enum:
          - active
          - archived
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.WebResponse-array_model_Account'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      description: Create a new account in the active workspace.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.CreateAccountRequest'
              description: Account payload
              summary: request
        description: Account payload
        required: true
      responses:
