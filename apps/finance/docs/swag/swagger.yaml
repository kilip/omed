components:
  schemas:
    model.Account:
      properties:
        code:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        createdByName:
          type: string
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
        status:
          $ref: '#/components/schemas/model.AccountStatus'
        type:
          $ref: '#/components/schemas/model.AccountType'
        updatedAt:
          type: string
        updatedBy:
          type: string
        updatedByName:
          type: string
        workspaceId:
          type: string
      type: object
    model.AccountStatus:
      enum:
      - active
      - archived
      type: string
      x-enum-varnames:
      - AccountStatusActive
      - AccountStatusArchived
    model.AccountType:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      x-enum-varnames:
      - AccountTypeAsset
      - AccountTypeLiability
      - AccountTypeEquity
      - AccountTypeRevenue
      - AccountTypeExpense
    model.CreateAccountRequest:
      properties:
        code:
          maxLength: 32
          type: string
        currency:
          example: IDR
          type: string
        description:
          maxLength: 1000
          type: string
        name:
          maxLength: 255
          type: string
        parentId:
          type: string
        type:
          $ref: '#/components/schemas/model.AccountType'
      required:
      - code
      - currency
      - name
      - type
      type: object
    model.CreateLedgerPeriodRequest:
      properties:
        endDate:
          type: string
        startDate:
          type: string
        status:
          $ref: '#/components/schemas/model.LedgerPeriodStatus'
      required:
      - endDate
      - startDate
      type: object
    model.ErrorBody:
      properties:
        code:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/model.FieldError'
          type: array
          uniqueItems: false
        message:
          type: string
      type: object
    model.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/model.ErrorBody'
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.FieldError:
      properties:
        field:
          type: string
        rule:
          type: string
      type: object
    model.LedgerPeriod:
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        createdByName:
          type: string
        endDate:
          type: string
        id:
          type: string
        startDate:
          type: string
        status:
          $ref: '#/components/schemas/model.LedgerPeriodStatus'
        updatedAt:
          type: string
        updatedBy:
          type: string
        updatedByName:
          type: string
        workspaceId:
          type: string
      type: object
    model.LedgerPeriodStatus:
      enum:
      - open
      - closed
      - locked
      type: string
      x-enum-varnames:
      - LedgerPeriodStatusOpen
      - LedgerPeriodStatusClosed
      - LedgerPeriodStatusLocked
    model.Meta:
      properties:
        cursor:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
      type: object
    model.UpdateAccountRequest:
      properties:
        description:
          maxLength: 1000
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        parentId:
          type: string
        status:
          $ref: '#/components/schemas/model.AccountStatus'
      type: object
    model.UpdateLedgerPeriodRequest:
      properties:
        status:
          $ref: '#/components/schemas/model.LedgerPeriodStatus'
      required:
      - status
      type: object
    model.WebResponse-array_model_Account:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.Account'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.WebResponse-array_model_LedgerPeriod:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.LedgerPeriod'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.WebResponse-model_Account:
      properties:
        data:
          $ref: '#/components/schemas/model.Account'
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.WebResponse-model_LedgerPeriod:
      properties:
        data:
          $ref: '#/components/schemas/model.LedgerPeriod'
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
