{{- include "omed.validateSecrets" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omed.secretName" . }}
  labels:
    {{- include "omed.labels" (dict "ctx" $) | nindent 4 }}
  annotations:
    # Rendered as a hook so the pre-install migration Job can read it.
    # Hook resources are not removed by `helm uninstall`.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  OMED_DB_URL: {{ $s.dbUrl | quote }}
  OMED_AUTH_SECRET: {{ $s.authSecret | quote }}
  {{- with $s.secretKey }}
  OMED_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.googleClientId }}
  OMED_GOOGLE_ID: {{ . | quote }}
  {{- end }}
  {{- with $s.googleClientSecret }}
  OMED_GOOGLE_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $s.githubClientId }}
  OMED_GITHUB_ID: {{ . | quote }}
  {{- end }}
  {{- with $s.githubClientSecret }}
  OMED_GITHUB_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $s.mailerUser }}
  OMED_MAILER_USER: {{ . | quote }}
  {{- end }}
  {{- with $s.mailerPassword }}
  OMED_MAILER_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.s3AccessKey }}
  OMED_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.s3SecretKey }}
  OMED_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
