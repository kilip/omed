{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omed.fullname" . }}-web
  labels:
    {{- include "omed.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omed.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omed.fullname" . }}-api
  labels:
    {{- include "omed.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omed.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        - podSelector:
            matchLabels:
              {{- include "omed.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
      ports:
        - port: http
{{- end }}
