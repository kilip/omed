{{- range $component := list "api" "web" }}
{{- $v := index $.Values $component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omed.fullname" $ }}-{{ $component }}
  labels:
    {{- include "omed.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "omed.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
{{- end }}
