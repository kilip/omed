[tools]
go = "1.27.1"
bun = "1.4.4"
node = "26"
air = "1.67.4"
swag = "2.0.0-rc6"
atlas = "latest"
golangci-lint = "latest"
helm = "latest"
kubeconform = "0.8.0"
gh = "latest"
starship = "1.26.0"

[tasks.dev]
description = "Start all applications in watch mode"
run = "bun run dev"

[tasks.build]
description = "Build packages and applications"
run = "bun run build"

[tasks.lint]
description = "Run Biome check across the repository"
run = "bun run lint"

[tasks.format]
description = "Auto-format files with Biome"
run = "bun run format"

[tasks.typecheck]
description = "Run TypeScript typechecks"
run = "bun run typecheck"

[tasks.test]
description = "Run turbo test suite"
run = "bun run test"

[tasks."test:api"]
description = "Run Go unit and integration tests"
dir = "apps/api"
run = "go test ./..."

[tasks."tidy:api"]
description = "Sync Go dependencies (go mod tidy)"
dir = "apps/api"
run = "go mod tidy"

[tasks."gen:api"]
description = "Regenerate Ent code (go generate ./ent)"
dir = "apps/api"
run = "go generate ./ent"

[tasks.e2e]
description = "Run end-to-end tests (Cucumber + Playwright)"
run = "bun run e2e"

[tasks."e2e:setup"]
description = "Install the Playwright chromium browser for e2e"
run = "bunx playwright install chromium"

[tasks."e2e:infra:up"]
description = "Start postgres and rustfs for e2e and wait until healthy"
run = "docker compose -f .devcontainer/compose.yaml -f .github/compose.e2e.yaml up -d --wait postgres rustfs"

[tasks."e2e:infra:down"]
description = "Stop the e2e postgres and rustfs containers (keeps volumes)"
run = "docker compose -f .devcontainer/compose.yaml -f .github/compose.e2e.yaml stop postgres rustfs"

[tasks."e2e:local"]
description = "Start e2e infra, then run e2e tests (filter: -- --name \"scenario name\")"
depends = ["e2e:infra:up"]
dir = "e2e"
run = "bun run e2e"

[tasks."db:migrate"]
description = "Apply pending Atlas database migrations"
run = "bun run db:migrate"

[tasks."db:diff"]
description = "Generate versioned Atlas migration from Ent schemas (pass the name after --)"
dir = "apps/api"
run = "go run ./cmd/migrate"
